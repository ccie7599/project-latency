<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINODE GLOBAL NETWORK MONITOR</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --green: #00ff41;
    --green-mid: #00cc33;
    --green-dim: #006b1f;
    --green-dark: #002a0a;
    --amber: #ffb000;
    --red: #ff3333;
    --bg: #000000;
    --panel-bg: rgba(0, 20, 5, 0.85);
    --border: rgba(0, 255, 65, 0.25);
}

body {
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    cursor: crosshair;
}

/* CRT scanline overlay */
body::after {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0, 0, 0, 0.15) 0px,
        rgba(0, 0, 0, 0.15) 1px,
        transparent 1px,
        transparent 3px
    );
    pointer-events: none;
    z-index: 100;
}

/* Vignette */
body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 99;
}

#map-container {
    width: 100vw;
    height: 100vh;
    position: absolute;
    top: 0; left: 0;
}

#map-container svg {
    width: 100%;
    height: 100%;
}

.land { fill: none; stroke: var(--green-dim); stroke-width: 0.8; }
.boundary { fill: none; stroke: var(--green-dark); stroke-width: 0.4; }
.graticule { fill: none; stroke: rgba(0, 255, 65, 0.06); stroke-width: 0.3; }

.region-dot {
    fill: var(--green);
    filter: url(#glow);
    cursor: pointer;
}
.region-dot:hover { fill: #ffffff; }
.region-dot.selected { fill: #ffffff; r: 5; }

.latency-arc {
    fill: none;
    stroke-linecap: round;
}

/* Header bar */
#header {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 48px;
    background: var(--panel-bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 10;
    font-size: 13px;
}

#header .title {
    font-size: 16px;
    letter-spacing: 3px;
    text-shadow: 0 0 10px var(--green), 0 0 20px var(--green-dim);
}

#header .live-indicator {
    color: var(--green);
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
}

#header .stats {
    display: flex;
    gap: 24px;
    font-size: 12px;
}

#header .stats span { color: var(--green-mid); }
#header .stats b { color: var(--green); }

/* Control panel (right side) */
#controls {
    position: absolute;
    top: 60px;
    right: 12px;
    width: 240px;
    z-index: 10;
}

.panel {
    background: var(--panel-bg);
    border: 1px solid var(--border);
    margin-bottom: 8px;
    padding: 10px;
}

.panel h3 {
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--green-mid);
    margin-bottom: 8px;
    text-transform: uppercase;
}

.mode-btn {
    display: block;
    width: 100%;
    padding: 6px 10px;
    margin-bottom: 4px;
    background: transparent;
    border: 1px solid var(--green-dark);
    color: var(--green-dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    text-align: left;
    transition: all 0.15s;
}

.mode-btn:hover { border-color: var(--green-mid); color: var(--green-mid); }
.mode-btn.active {
    border-color: var(--green);
    color: var(--green);
    background: rgba(0, 255, 65, 0.05);
    text-shadow: 0 0 8px var(--green-dim);
}

/* Detail panel (left side) */
#detail {
    position: absolute;
    bottom: 12px;
    left: 12px;
    width: 320px;
    max-height: 45vh;
    overflow-y: auto;
    z-index: 10;
    display: none;
}

.latency-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
    font-size: 11px;
    border-bottom: 1px solid rgba(0,255,65,0.05);
}

.latency-row .target { color: var(--green-mid); }
.latency-row .rtt { font-weight: bold; }

.rtt-low { color: var(--green); }
.rtt-mid { color: var(--amber); }
.rtt-high { color: var(--red); }

/* Tool panel (right bottom) */
#tool-panel {
    position: absolute;
    bottom: 12px;
    right: 12px;
    width: 300px;
    max-height: 60vh;
    overflow-y: auto;
    z-index: 10;
    display: none;
}
#tool-close {
    float: right;
    background: none;
    border: none;
    color: var(--green-dim);
    font-size: 16px;
    cursor: pointer;
    margin: -4px -4px 0 0;
}
#tool-close:hover { color: var(--green); }

select, input[type="text"] {
    width: 100%;
    padding: 5px 8px;
    margin-bottom: 6px;
    background: rgba(0, 255, 65, 0.05);
    border: 1px solid var(--green-dark);
    color: var(--green);
    font: inherit;
    font-size: 12px;
}
select option { background: #001a00; }

.az-result {
    padding: 6px 8px;
    margin-top: 4px;
    font-size: 11px;
    line-height: 1.5;
    border-left: 2px solid var(--green-dim);
}
.az-sync { border-left-color: var(--green); }
.az-async { border-left-color: var(--amber); }
.az-dr { border-left-color: var(--red); }

/* Heatmap overlay */
#heatmap-overlay {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0, 5, 0, 0.96);
    border: 1px solid var(--border);
    padding: 16px;
    z-index: 20;
    display: none;
    overflow: auto;
    max-width: 95vw;
    max-height: 90vh;
}
#heatmap-overlay canvas { cursor: crosshair; }
#heatmap-close {
    position: absolute; top: 4px; right: 10px;
    background: none; border: none;
    color: var(--green-dim); font-size: 18px; cursor: pointer;
}

/* Legend */
#legend {
    position: absolute;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 20px;
    font-size: 10px;
    letter-spacing: 1px;
    z-index: 10;
    color: var(--green-dim);
}
.legend-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 4px;
    vertical-align: middle;
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--green-dark); }
</style>
</head>
<body>

<div id="map-container"></div>

<div id="header">
    <span class="title">LINODE GLOBAL NETWORK MONITOR</span>
    <div class="stats">
        <span>NODES <b id="stat-nodes">0</b></span>
        <span>ROUTES <b id="stat-routes">0</b></span>
        <span>AVG RTT <b id="stat-avg">--</b></span>
        <span>SCRAPE <b id="stat-scrape">--</b></span>
        <span class="live-indicator">&#x2588; LIVE</span>
    </div>
</div>

<div id="controls">
    <div class="panel">
        <h3>View</h3>
        <button class="mode-btn active" data-mode="map" onclick="setMode('map')">MAP — ALL ROUTES</button>
        <button class="mode-btn" data-mode="heatmap" onclick="setMode('heatmap')">HEATMAP MATRIX</button>
        <button class="mode-btn" data-mode="client" onclick="setMode('client')">CLIENT LATENCY</button>
    </div>
    <div class="panel">
        <h3>Filter</h3>
        <select id="filter-select" onchange="applyFilter()">
            <option value="all">ALL ROUTES</option>
            <option value="unique" selected>UNIQUE REGIONS ONLY</option>
            <optgroup label="CONTINENT">
                <option value="continent:na">NORTH AMERICA</option>
                <option value="continent:sa">SOUTH AMERICA</option>
                <option value="continent:eu">EUROPE</option>
                <option value="continent:ap">ASIA PACIFIC</option>
                <option value="continent:oc">OCEANIA</option>
                <option value="continent:af">AFRICA</option>
            </optgroup>
            <optgroup label="COUNTRY" id="filter-countries">
            </optgroup>
        </select>
    </div>
    <div class="panel">
        <h3>Tools</h3>
        <button class="mode-btn" data-mode="az" onclick="setMode('az')">AZ PAIR SELECTOR</button>
        <button class="mode-btn" data-mode="finder" onclick="setMode('finder')">REGION FINDER</button>
    </div>
</div>

<div class="panel" id="detail">
    <h3 id="detail-title">REGION DETAIL</h3>
    <div id="detail-content"></div>
</div>

<div class="panel" id="tool-panel">
    <button id="tool-close" onclick="closeTool()">&times;</button>
    <h3 id="tool-title">TOOL</h3>
    <div id="tool-content"></div>
</div>

<div id="heatmap-overlay">
    <button id="heatmap-close" onclick="setMode('map')">&times;</button>
    <h3 style="color:var(--green-mid);letter-spacing:2px;margin-bottom:10px;">LATENCY MATRIX (MS)</h3>
    <canvas id="heatmap-canvas"></canvas>
</div>

<div id="legend">
    <span><span class="legend-dot" style="background:var(--green)"></span> &lt;50MS</span>
    <span><span class="legend-dot" style="background:var(--amber)"></span> 50-150MS</span>
    <span><span class="legend-dot" style="background:var(--red)"></span> &gt;150MS</span>
</div>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script>
// ============================================================
// State
// ============================================================
let allRegions = [];
let latencyResults = [];
let selectedRegion = null;
let currentMode = 'map';
let currentFilter = 'unique'; // 'all', 'unique', 'continent:xx', 'country:xx'
let svg, g, projection, pathGen, zoom;

// ============================================================
// Color helpers
// ============================================================
function rttColor(ms) {
    if (ms < 50) return getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
    if (ms < 150) return getComputedStyle(document.documentElement).getPropertyValue('--amber').trim();
    return getComputedStyle(document.documentElement).getPropertyValue('--red').trim();
}
function rttOpacity(ms) {
    // Brighter = lower latency (faster connections are more prominent)
    if (ms < 20) return 0.7;
    if (ms < 50) return 0.5;
    if (ms < 100) return 0.35;
    if (ms < 200) return 0.2;
    return 0.1;
}
function rttClass(ms) {
    if (ms < 50) return 'rtt-low';
    if (ms < 150) return 'rtt-mid';
    return 'rtt-high';
}

// ============================================================
// Map initialization
// ============================================================
async function initMap() {
    const width = window.innerWidth;
    const height = window.innerHeight;

    projection = d3.geoNaturalEarth1()
        .scale(width / 5.5)
        .translate([width / 2, height / 2]);

    pathGen = d3.geoPath().projection(projection);

    svg = d3.select('#map-container')
        .append('svg')
        .attr('width', width)
        .attr('height', height);

    // Glow filter
    const defs = svg.append('defs');
    const filter = defs.append('filter').attr('id', 'glow');
    filter.append('feGaussianBlur').attr('stdDeviation', '2').attr('result', 'blur');
    const merge = filter.append('feMerge');
    merge.append('feMergeNode').attr('in', 'blur');
    merge.append('feMergeNode').attr('in', 'SourceGraphic');

    // Arc glow filter
    const arcFilter = defs.append('filter').attr('id', 'arcglow');
    arcFilter.append('feGaussianBlur').attr('stdDeviation', '1.5').attr('result', 'blur');
    const arcMerge = arcFilter.append('feMerge');
    arcMerge.append('feMergeNode').attr('in', 'blur');
    arcMerge.append('feMergeNode').attr('in', 'SourceGraphic');

    g = svg.append('g');

    // Zoom behavior
    zoom = d3.zoom()
        .scaleExtent([1, 12])
        .on('zoom', (event) => {
            g.attr('transform', event.transform);
        });
    svg.call(zoom);

    // Load world topology
    const world = await d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
    const land = topojson.feature(world, world.objects.countries);
    const borders = topojson.mesh(world, world.objects.countries, (a, b) => a !== b);

    // Graticule (grid lines)
    const graticule = d3.geoGraticule().step([30, 30]);
    g.append('path')
        .datum(graticule())
        .attr('class', 'graticule')
        .attr('d', pathGen);

    // Land masses
    g.selectAll('.land')
        .data(land.features)
        .join('path')
        .attr('class', 'land')
        .attr('d', pathGen);

    // Borders
    g.append('path')
        .datum(borders)
        .attr('class', 'boundary')
        .attr('d', pathGen);

    // Layer groups
    g.append('g').attr('id', 'arcs-layer');
    g.append('g').attr('id', 'dots-layer');
    g.append('g').attr('id', 'labels-layer');

    // Handle resize
    window.addEventListener('resize', () => {
        const w = window.innerWidth, h = window.innerHeight;
        svg.attr('width', w).attr('height', h);
        projection.scale(w / 5.5).translate([w / 2, h / 2]);
        redrawMap();
    });
}

// ============================================================
// Data loading
// ============================================================
async function loadRegions() {
    const resp = await fetch('/api/v1/regions');
    allRegions = await resp.json();
    document.getElementById('stat-nodes').textContent = allRegions.length;

    // Populate country filter options
    const countries = {};
    const countryLabels = {
        us: 'UNITED STATES', ca: 'CANADA', mx: 'MEXICO',
        br: 'BRAZIL', co: 'COLOMBIA', cl: 'CHILE',
        gb: 'UNITED KINGDOM', de: 'GERMANY', fr: 'FRANCE',
        nl: 'NETHERLANDS', se: 'SWEDEN', es: 'SPAIN',
        it: 'ITALY', no: 'NORWAY',
        sg: 'SINGAPORE', jp: 'JAPAN', in: 'INDIA',
        id: 'INDONESIA', my: 'MALAYSIA',
        au: 'AUSTRALIA', nz: 'NEW ZEALAND',
        za: 'SOUTH AFRICA',
    };
    allRegions.forEach(r => {
        if (!countries[r.country]) countries[r.country] = 0;
        countries[r.country]++;
    });
    const optgroup = document.getElementById('filter-countries');
    Object.keys(countries).sort().forEach(cc => {
        if (countries[cc] >= 2) { // only show countries with 2+ regions
            const opt = document.createElement('option');
            opt.value = `country:${cc}`;
            opt.textContent = `${countryLabels[cc] || cc.toUpperCase()} (${countries[cc]})`;
            optgroup.appendChild(opt);
        }
    });

    drawDots();
}

async function loadMatrix() {
    try {
        const resp = await fetch('/api/v1/matrix');
        const data = await resp.json();
        latencyResults = data.results || [];
        updateStats();
        drawArcs();
    } catch (e) {
        console.error('matrix fetch:', e);
    }
}

function updateStats() {
    const filteredIds = getFilteredRegionIds();
    const filtered = latencyResults.filter(r => filteredIds.has(r.source) && filteredIds.has(r.target));
    const n = filtered.length;
    document.getElementById('stat-nodes').textContent = filteredIds.size;
    document.getElementById('stat-routes').textContent = n;
    if (n > 0) {
        const avg = filtered.reduce((s, r) => s + r.rtt_ms, 0) / n;
        document.getElementById('stat-avg').textContent = avg.toFixed(1) + 'MS';
    }
    document.getElementById('stat-scrape').textContent = new Date().toLocaleTimeString();
}

// ============================================================
// Map drawing
// ============================================================
function drawDots() {
    const regionMap = {};
    allRegions.forEach(r => regionMap[r.id] = r);
    const filteredIds = getFilteredRegionIds();

    const dots = d3.select('#dots-layer')
        .selectAll('.region-dot')
        .data(allRegions, d => d.id);

    dots.enter()
        .append('circle')
        .attr('class', 'region-dot')
        .attr('cx', d => projection([d.lon, d.lat])[0])
        .attr('cy', d => projection([d.lon, d.lat])[1])
        .on('click', (event, d) => onRegionClick(d))
        .append('title')
        .text(d => `${d.label} (${d.id})`);

    dots
        .attr('cx', d => projection([d.lon, d.lat])[0])
        .attr('cy', d => projection([d.lon, d.lat])[1])
        .attr('r', d => d.id === selectedRegion ? 5 : filteredIds.has(d.id) ? 3 : 1.5)
        .attr('fill', d => d.id === selectedRegion ? '#ffffff' : filteredIds.has(d.id) ? 'var(--green)' : 'var(--green-dark)')
        .attr('opacity', d => filteredIds.has(d.id) ? 1 : 0.3);

    // Region labels (visible at zoom)
    const labels = d3.select('#labels-layer')
        .selectAll('.region-label')
        .data(allRegions, d => d.id);

    labels.enter()
        .append('text')
        .attr('class', 'region-label')
        .attr('x', d => projection([d.lon, d.lat])[0] + 6)
        .attr('y', d => projection([d.lon, d.lat])[1] + 3)
        .attr('fill', 'var(--green-dim)')
        .attr('font-size', '7px')
        .text(d => d.short);

    labels
        .attr('x', d => projection([d.lon, d.lat])[0] + 6)
        .attr('y', d => projection([d.lon, d.lat])[1] + 3);
}

// ============================================================
// Filtering
// ============================================================
function applyFilter() {
    currentFilter = document.getElementById('filter-select').value;
    drawDots();
    drawArcs();
}

function getFilteredRegionIds() {
    const regionMap = {};
    allRegions.forEach(r => regionMap[r.id] = r);

    if (currentFilter === 'all') {
        return new Set(allRegions.map(r => r.id));
    }

    if (currentFilter === 'unique') {
        // Keep only one region per city (first occurrence)
        const seenCities = new Set();
        const ids = new Set();
        for (const r of allRegions) {
            if (!seenCities.has(r.city)) {
                seenCities.add(r.city);
                ids.add(r.id);
            }
        }
        return ids;
    }

    if (currentFilter.startsWith('continent:')) {
        const cont = currentFilter.split(':')[1];
        return new Set(allRegions.filter(r => r.continent === cont).map(r => r.id));
    }

    if (currentFilter.startsWith('country:')) {
        const cc = currentFilter.split(':')[1];
        return new Set(allRegions.filter(r => r.country === cc).map(r => r.id));
    }

    return new Set(allRegions.map(r => r.id));
}

function drawArcs() {
    if (currentMode !== 'map') return;

    const regionMap = {};
    allRegions.forEach(r => regionMap[r.id] = r);

    const filteredIds = getFilteredRegionIds();

    let data = latencyResults.filter(r =>
        filteredIds.has(r.source) && filteredIds.has(r.target)
    );

    if (selectedRegion) {
        data = data.filter(r => r.source === selectedRegion || r.target === selectedRegion);
    }

    // Deduplicate: only keep one direction per pair
    if (!selectedRegion) {
        const seen = new Set();
        data = data.filter(r => {
            const key = [r.source, r.target].sort().join(':');
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    }

    const arcs = d3.select('#arcs-layer')
        .selectAll('.latency-arc')
        .data(data.filter(r => regionMap[r.source] && regionMap[r.target]), d => d.source + ':' + d.target);

    arcs.exit().remove();

    const arcEnter = arcs.enter()
        .append('path')
        .attr('class', 'latency-arc');

    arcs.merge(arcEnter)
        .attr('d', d => {
            const src = regionMap[d.source];
            const tgt = regionMap[d.target];
            const s = projection([src.lon, src.lat]);
            const t = projection([tgt.lon, tgt.lat]);
            const dx = t[0] - s[0], dy = t[1] - s[1];
            const dr = Math.sqrt(dx * dx + dy * dy) * 1.5;
            return `M${s[0]},${s[1]}A${dr},${dr} 0 0,1 ${t[0]},${t[1]}`;
        })
        .attr('stroke', d => rttColor(d.rtt_ms))
        .attr('stroke-opacity', d => selectedRegion ? rttOpacity(d.rtt_ms) * 2 : rttOpacity(d.rtt_ms))
        .attr('stroke-width', d => selectedRegion ? 1.2 : 0.5);

    // Update dot highlighting
    d3.selectAll('.region-dot')
        .classed('selected', d => d.id === selectedRegion)
        .attr('r', d => d.id === selectedRegion ? 5 : 3);
}

function redrawMap() {
    drawDots();
    drawArcs();
}

// ============================================================
// Interactions
// ============================================================
function onRegionClick(region) {
    if (selectedRegion === region.id) {
        selectedRegion = null;
        document.getElementById('detail').style.display = 'none';
    } else {
        selectedRegion = region.id;
        showRegionDetail(region.id);
    }
    drawArcs();
}

function showRegionDetail(regionId) {
    const panel = document.getElementById('detail');
    const region = allRegions.find(r => r.id === regionId);
    if (!region) return;

    document.getElementById('detail-title').textContent = `${region.label.toUpperCase()} [${region.id}]`;

    const fromRegion = latencyResults.filter(r => r.source === regionId);
    fromRegion.sort((a, b) => a.rtt_ms - b.rtt_ms);

    const regionMap = {};
    allRegions.forEach(r => regionMap[r.id] = r);

    let html = '';
    fromRegion.forEach(r => {
        const tgt = regionMap[r.target];
        if (!tgt) return;
        html += `<div class="latency-row">
            <span class="target">${tgt.short.toUpperCase()}</span>
            <span class="rtt ${rttClass(r.rtt_ms)}">${r.rtt_ms.toFixed(1)}MS</span>
        </div>`;
    });

    if (!html) html = '<div style="color:var(--green-dim);font-size:11px;">AWAITING DATA...</div>';
    document.getElementById('detail-content').innerHTML = html;
    panel.style.display = 'block';
}

// ============================================================
// Mode switching
// ============================================================
function closeTool() {
    document.getElementById('tool-panel').style.display = 'none';
    selectedRegion = null;
    drawDots();
    drawArcs();
}

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === mode);
    });

    document.getElementById('heatmap-overlay').style.display = 'none';
    document.getElementById('tool-panel').style.display = 'none';

    switch (mode) {
        case 'map':
            selectedRegion = null;
            document.getElementById('detail').style.display = 'none';
            drawArcs();
            break;
        case 'heatmap':
            showHeatmap();
            break;
        case 'client':
            measureClientLatency();
            break;
        case 'az':
            showAZSelector();
            break;
        case 'finder':
            showRegionFinder();
            break;
    }
}

// ============================================================
// Heatmap
// ============================================================
function showHeatmap() {
    const panel = document.getElementById('heatmap-overlay');
    panel.style.display = 'block';
    const canvas = document.getElementById('heatmap-canvas');
    const ctx = canvas.getContext('2d');

    const filteredIds = getFilteredRegionIds();
    const regionSet = new Set();
    latencyResults.forEach(r => {
        if (filteredIds.has(r.source)) regionSet.add(r.source);
        if (filteredIds.has(r.target)) regionSet.add(r.target);
    });
    const regionIds = Array.from(regionSet).sort();
    const n = regionIds.length;
    if (n === 0) return;

    const cellSize = Math.max(10, Math.min(16, Math.floor(650 / n)));
    const labelW = 70, labelH = 70;
    canvas.width = labelW + n * cellSize;
    canvas.height = labelH + n * cellSize;

    const lookup = {};
    latencyResults.forEach(r => { lookup[r.source + ':' + r.target] = r.rtt_ms; });

    ctx.fillStyle = '#00ff41';
    ctx.font = `${Math.min(9, cellSize - 1)}px 'Share Tech Mono', monospace`;
    ctx.textAlign = 'right';
    regionIds.forEach((id, i) => {
        const short = allRegions.find(r => r.id === id)?.short || id.slice(0, 5);
        ctx.fillStyle = '#006b1f';
        ctx.fillText(short.toUpperCase(), labelW - 3, labelH + i * cellSize + cellSize / 2 + 3);
    });

    ctx.save();
    ctx.textAlign = 'left';
    regionIds.forEach((id, i) => {
        const short = allRegions.find(r => r.id === id)?.short || id.slice(0, 5);
        ctx.save();
        ctx.translate(labelW + i * cellSize + cellSize / 2, labelH - 3);
        ctx.rotate(-Math.PI / 4);
        ctx.fillStyle = '#006b1f';
        ctx.fillText(short.toUpperCase(), 0, 0);
        ctx.restore();
    });
    ctx.restore();

    regionIds.forEach((src, i) => {
        regionIds.forEach((tgt, j) => {
            const x = labelW + j * cellSize;
            const y = labelH + i * cellSize;
            if (src === tgt) {
                ctx.fillStyle = '#001a00';
                ctx.fillRect(x, y, cellSize - 1, cellSize - 1);
                return;
            }
            const ms = lookup[src + ':' + tgt];
            if (ms === undefined) {
                ctx.fillStyle = '#001a00';
            } else if (ms < 50) {
                ctx.fillStyle = `rgba(0, 255, 65, ${0.3 + 0.5 * (1 - ms / 50)})`;
            } else if (ms < 150) {
                ctx.fillStyle = `rgba(255, 176, 0, ${0.3 + 0.4 * (1 - (ms - 50) / 100)})`;
            } else {
                ctx.fillStyle = `rgba(255, 51, 51, ${0.3 + 0.3 * Math.min(1, (ms - 150) / 200)})`;
            }
            ctx.fillRect(x, y, cellSize - 1, cellSize - 1);
        });
    });

    canvas.onmousemove = (e) => {
        const rect = canvas.getBoundingClientRect();
        const col = Math.floor((e.clientX - rect.left - labelW) / cellSize);
        const row = Math.floor((e.clientY - rect.top - labelH) / cellSize);
        if (col >= 0 && col < n && row >= 0 && row < n) {
            const ms = lookup[regionIds[row] + ':' + regionIds[col]];
            canvas.title = ms !== undefined
                ? `${regionIds[row]} → ${regionIds[col]}: ${ms.toFixed(1)}ms`
                : `${regionIds[row]} → ${regionIds[col]}: NO DATA`;
        }
    };
}

// ============================================================
// Client latency measurement
// ============================================================
async function measureClientLatency() {
    document.getElementById('detail').style.display = 'block';
    document.getElementById('detail-title').textContent = 'CLIENT LATENCY TEST';
    document.getElementById('detail-content').innerHTML = '<div style="color:var(--green-dim)">MEASURING 0/' + allRegions.length + '...</div>';

    // Build per-region ping URLs: {short}.latency.connected-cloud.io:8080
    const domain = window.location.hostname.replace(/^[^.]+\./, ''); // latency.connected-cloud.io -> connected-cloud.io...
    // Derive base domain from hub hostname: latency.connected-cloud.io
    const hubHost = window.location.hostname; // latency.connected-cloud.io
    const baseDomain = hubHost; // short.latency.connected-cloud.io

    let done = 0;

    // Measure all regions in parallel
    const promises = allRegions.map(async (region) => {
        const url = `http://${region.short}.${baseDomain}:8080/ping`;
        try {
            await fetch(url, { mode: 'cors', cache: 'no-store' }); // warmup
            const samples = [];
            for (let i = 0; i < 3; i++) {
                const t0 = performance.now();
                await fetch(url, { mode: 'cors', cache: 'no-store' });
                samples.push(performance.now() - t0);
            }
            samples.sort((a, b) => a - b);
            done++;
            document.getElementById('detail-content').innerHTML =
                `<div style="color:var(--green-dim)">MEASURING ${done}/${allRegions.length}...</div>`;
            return {
                source: 'client', target: region.id,
                rtt_ms: Math.round(samples[1] * 10) / 10
            };
        } catch (e) {
            done++;
            return null;
        }
    });

    const settled = await Promise.allSettled(promises);
    const results = settled
        .filter(r => r.status === 'fulfilled' && r.value)
        .map(r => r.value);
    results.sort((a, b) => a.rtt_ms - b.rtt_ms);

    const regionMap = {};
    allRegions.forEach(r => regionMap[r.id] = r);

    let html = '';
    results.forEach(r => {
        const tgt = regionMap[r.target];
        if (!tgt) return;
        html += `<div class="latency-row">
            <span class="target">${tgt.label.toUpperCase()}</span>
            <span class="rtt ${rttClass(r.rtt_ms)}">${r.rtt_ms.toFixed(1)}MS</span>
        </div>`;
    });
    document.getElementById('detail-content').innerHTML = html;
}

// ============================================================
// AZ Pair Selector
// ============================================================
function showAZSelector() {
    const panel = document.getElementById('tool-panel');
    panel.style.display = 'block';
    document.getElementById('tool-title').textContent = 'AZ PAIR SELECTOR';
    document.getElementById('tool-content').innerHTML = `
        <select id="az-primary" onchange="loadAZPairs()">
            <option value="">SELECT PRIMARY REGION...</option>
            ${allRegions.map(r => `<option value="${r.id}">${r.label.toUpperCase()} (${r.id})</option>`).join('')}
        </select>
        <div id="az-results"></div>`;
}

async function loadAZPairs() {
    const primary = document.getElementById('az-primary').value;
    if (!primary) return;
    selectedRegion = primary;
    drawArcs();

    try {
        const resp = await fetch(`/api/v1/az-pairs?primary=${primary}`);
        const data = await resp.json();
        const pairs = data.pairs || [];
        const regionMap = {};
        allRegions.forEach(r => regionMap[r.id] = r);

        const categories = {
            'sync-capable': { label: 'SYNC REPLICATION', css: 'az-sync' },
            'async-low-rpo': { label: 'ASYNC (LOW RPO)', css: 'az-async' },
            'dr-only': { label: 'DR ONLY', css: 'az-dr' }
        };

        let html = '';
        for (const [cat, meta] of Object.entries(categories)) {
            const catPairs = pairs.filter(p => p.category === cat).slice(0, 5);
            if (!catPairs.length) continue;
            html += `<div style="margin-top:8px;font-size:10px;color:var(--green-dim);letter-spacing:1px;">${meta.label}</div>`;
            catPairs.forEach(p => {
                const tgt = regionMap[p.secondary];
                const warn = p.co_located ? '<br><span style="color:var(--amber)">SAME METRO — LIMITED FAULT ISOLATION</span>' : '';
                html += `<div class="az-result ${meta.css}">
                    <b>${tgt ? tgt.label.toUpperCase() : p.secondary}</b><br>
                    RTT: ${p.rtt_ms.toFixed(1)}MS | DIST: ${Math.round(p.distance_km)}KM${warn}<br>
                    <span style="color:var(--green-dim)">${p.rationale}</span>
                </div>`;
            });
        }
        if (!html) html = '<div style="color:var(--green-dim);margin-top:6px">NO DATA YET</div>';
        document.getElementById('az-results').innerHTML = html;
    } catch (e) {
        document.getElementById('az-results').innerHTML = '<div style="color:var(--red)">QUERY FAILED</div>';
    }
}

// ============================================================
// Region Finder
// ============================================================
function showRegionFinder() {
    const panel = document.getElementById('tool-panel');
    panel.style.display = 'block';
    document.getElementById('tool-title').textContent = 'REGION FINDER';
    document.getElementById('tool-content').innerHTML = `
        <div style="font-size:10px;color:var(--green-dim);margin-bottom:6px;">ENTER COORDINATES</div>
        <input type="text" id="finder-lat" placeholder="LATITUDE (e.g., 40.7128)">
        <input type="text" id="finder-lon" placeholder="LONGITUDE (e.g., -74.0060)">
        <button class="mode-btn" onclick="findNearest()">FIND NEAREST REGIONS</button>
        <button class="mode-btn" onclick="findFromBrowser()">USE MY LOCATION</button>
        <div id="finder-results"></div>`;
}

async function findNearest() {
    const lat = document.getElementById('finder-lat').value;
    const lon = document.getElementById('finder-lon').value;
    if (!lat || !lon) return;
    try {
        const resp = await fetch(`/api/v1/nearest?lat=${lat}&lon=${lon}`);
        const data = await resp.json();
        const nearest = data.nearest || [];
        let html = '';
        nearest.forEach((r, i) => {
            const css = i === 0 ? 'az-sync' : i < 3 ? 'az-async' : 'az-dr';
            html += `<div class="az-result ${css}">
                <b>${i + 1}. ${r.label.toUpperCase()}</b> (${r.id})<br>
                DISTANCE: ${Math.round(r.distance_km)}KM
            </div>`;
        });
        document.getElementById('finder-results').innerHTML = html;

        // Zoom to location
        const pt = projection([parseFloat(lon), parseFloat(lat)]);
        svg.transition().duration(750).call(
            zoom.transform,
            d3.zoomIdentity.translate(window.innerWidth / 2, window.innerHeight / 2).scale(4).translate(-pt[0], -pt[1])
        );
    } catch (e) {
        document.getElementById('finder-results').innerHTML = '<div style="color:var(--red)">QUERY FAILED</div>';
    }
}

async function findFromBrowser() {
    try {
        const pos = await new Promise((resolve, reject) => {
            navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
        });
        document.getElementById('finder-lat').value = pos.coords.latitude.toFixed(4);
        document.getElementById('finder-lon').value = pos.coords.longitude.toFixed(4);
        findNearest();
    } catch (e) {
        document.getElementById('finder-results').innerHTML = '<div style="color:var(--red)">GEOLOCATION DENIED</div>';
    }
}

// ============================================================
// WebSocket
// ============================================================
function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${proto}//${location.host}/ws/live`);
    let reconnectDelay = 3000;

    ws.onmessage = (event) => {
        try {
            const msg = JSON.parse(event.data);
            if (msg.results) {
                latencyResults = msg.results;
                updateStats();
                if (currentMode === 'map') drawArcs();
            }
        } catch (e) {}
    };
    ws.onopen = () => { reconnectDelay = 3000; };
    ws.onclose = () => {
        setTimeout(connectWS, reconnectDelay);
        reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
    };
    ws.onerror = () => { ws.close(); };
}

// ============================================================
// Startup
// ============================================================
(async function() {
    await initMap();
    await loadRegions();
    await loadMatrix();
    connectWS();
    setInterval(loadMatrix, 30000);
})();
